<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f7cff" />
  <title>🗺️ 스페인·포르투갈 여행 지출 대시보드</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 헤더 -->
  <header>
    <h1>🗺️ 스페인·포르투갈 지출 현황</h1>
    <p>Spain &amp; Portugal Travel Budget Tracker</p>
  </header>

  <div class="container">

    <!-- 에러/안내 배너 -->
    <div id="error-banner"></div>

    <!-- 로딩 -->
    <div id="loading">
      <div class="spinner"></div>
      <p>데이터 불러오는 중…</p>
    </div>

    <!-- ① 요약 카드 -->
    <section class="card" id="section-summary">
      <div class="card-header">
        <h2>📊 전체 요약</h2>
      </div>
      <div class="card-body">
        <div id="summary"></div>
        <p class="rate-info">1 EUR = <strong id="rate-display"></strong> KRW 적용</p>
      </div>
    </section>

    <!-- ② 날짜별 상세 내역 -->
    <section class="card" id="section-day-detail">
      <div class="card-header detail-header">
        <h2>🔍 날짜별 상세 내역</h2>
      </div>
      <div class="card-body">
        <!-- 날짜 선택 칩 목록 -->
        <div id="date-picker" class="date-picker"></div>
        <!-- 선택된 날짜의 상세 내역 -->
        <div id="day-detail-content" class="day-detail-content">
          <p class="empty-msg">날짜를 선택하면 상세 내역이 표시됩니다.</p>
        </div>
      </div>
    </section>

    <!-- ③ 일별 지출 차트 -->
    <section class="card" id="section-daily">
      <div class="card-header">
        <h2>📅 일별 지출</h2>
      </div>
      <div class="card-body">
        <div id="daily-chart"></div>
      </div>
    </section>

    <!-- ③ 도시별 지출 -->
    <section class="card" id="section-city">
      <div class="card-header">
        <h2>🏙️ 도시별 지출</h2>
      </div>
      <div class="card-body">
        <div id="city-chart"></div>
      </div>
    </section>

    <!-- ④ 카테고리별 지출 -->
    <section class="card" id="section-category">
      <div class="card-header">
        <h2>🗂️ 카테고리별 지출</h2>
      </div>
      <div class="card-body">
        <div id="category-chart"></div>
      </div>
    </section>

    <!-- ⑤ 최근 내역 -->
    <section class="card" id="section-recent">
      <div class="card-header">
        <h2>🧾 최근 지출 내역</h2>
      </div>
      <div class="card-body">
        <div id="recent-list"></div>
      </div>
    </section>

  </div><!-- /.container -->

  <script src="script.js"></script>
  <script>
    // 환율 표시
    document.getElementById("rate-display").textContent =
      typeof EUR_TO_KRW !== "undefined" ? EUR_TO_KRW.toLocaleString("ko-KR") : "1,500";
  </script>

</body>
</html>
